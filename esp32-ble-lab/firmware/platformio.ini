[platformio]
default_envs = xiao_esp32s3

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../../esp32/lib/protocol
    symlink://../../esp32/lib/servo
    symlink://../../esp32/lib/imu
    symlink://../../esp32/lib/ble
    symlink://../../esp32/lib/wifi
build_flags =
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

[env:xiao_esp32s3]
extends = env:esp32dev
board = seeed_xiao_esp32s3
upload_port = COM4
monitor_port = COM4
monitor_dtr = 1
monitor_rts = 0
