syntax = "proto3";
package uroa;
import "google/protobuf/descriptor.proto";

// Command v1への宣言的な対応。フィールド名だけを参照し、実装コードは指定しない。
message CommandCheck {
    string field = 1;
    uint32 equals = 2;
    uint32 max = 3;
    repeated uint32 one_of = 4;
}
message CommandServer {
    string handler = 1;
    string value_name = 2;
    uint32 value_scale = 3;
    bool context = 4;
    bool echo_channel = 5;
    bool notify_io_error = 6;
    bool status_only = 7;
    repeated CommandCheck checks = 8;
}
message StatusBinding {
    uint32 channel_count = 1;
    uint32 speed_flag = 2;
    uint32 speed_scale = 3;
}
message CommandCase {
    string equals = 1;
    string opcode = 2;
    string channel = 3;
    string value = 4;
    uint32 constant_value = 5;
    uint32 scale = 6;
    bool signed_value = 7;
    string duration = 8;
    CommandServer server = 9;
}
message CommandBinding {
    string selector = 1;
    repeated CommandCase cases = 2;
}

// 生成時だけ使う属性。Protocol Buffersのシリアライズは通信に使わない。
extend google.protobuf.FileOptions {
    uint32 api_version = 51001;
    uint32 max_pending = 51002;
}
extend google.protobuf.MessageOptions {
    bool wire_packet = 51101;
    string host_type = 51102;
    string host_import = 51103;
    string ts_codec = 51104; // 未指定なら生成しない。encodeまたはdecode。
    string cpp_codec = 51105; // 未指定なら生成しない。encodeまたはdecode。
    string result_enum = 51106; // 結果番号とメッセージを持つenum。
    StatusBinding status_binding = 51107;
}
extend google.protobuf.FieldOptions {
    uint32 bits = 51201;
    uint32 max_length = 51202;
    bool host_optional = 51203;
    uint32 fixed_value = 51204; // 固定値。受信の形式検査にも使う。
    uint32 min_value = 51205; // 整数・enumの受理下限。未指定なら型の下限。
    uint32 wire_default = 51206; // 要求へ明示指定しない場合の既存値。
}
extend google.protobuf.ServiceOptions {
    uint32 service_id = 51301;
    string scope = 51302;
}
extend google.protobuf.MethodOptions {
    uint32 method_id = 51401;
    string api_name = 51402;
    string transport = 51403;
    string completion = 51404;
    uint32 io_timeout_ms = 51405;
    bool synchronous = 51406;
    bool priority = 51407;
    string subscription = 51408;
    CommandBinding command = 51409;
}
extend google.protobuf.EnumValueOptions {
    string result_message = 51501;
    bool command_trace = 51502;
}
